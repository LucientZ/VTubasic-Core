name: Build Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main", "dev"]

jobs:
    ubuntu-tests:
        name: Ubuntu Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Update apt sources
              run: sudo apt update

            - name: Install SFML dependencies
              run: sudo apt install \
                       libxrandr-dev \
                       libxcursor-dev \
                       libxi-dev \
                       libudev-dev \
                       libfreetype-dev \
                       libflac-dev \
                       libvorbis-dev \
                       libgl1-mesa-dev \
                       libegl1-mesa-dev \
                       libfreetype-dev \
                       libharfbuzz-dev \
                       libmbedtls-dev \
                       libssh2-1-dev

            - name: Create Build Directory
              run: cmake -S . -B build -G Ninja
            
            - name: Build
              run: cmake --build build --config Release

            - name: Test
              run: ctest --test-dir build -C Release --output-on-failure 


    macos-tests:
        name: MacOS Tests
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - name: Create Build Directory
              run: cmake -S . -B build -G Xcode
            
            - name: Build
              run: cmake --build build --config Release

            - name: Test
              run: ctest --test-dir build -C Release --output-on-failure 